<!DOCTYPE html>
<html lang="en">
<head>
   <title>Simple Add Calculator</title>
</head>
<body>
   <h2 style="text-align: center;">Simple Add Calculator</h2>

   <input id="num1" placeholder="Enter number or text">
   <input id="num2" placeholder="Enter number or text">
   <button onclick="addfunction123()">
      CLICK here to ADD
   </button>

   <p id="result123">Result will show here</p> 

   <script>
      function addfunction123() {
         // 1. Get the raw string values from both boxes
         var val1 = document.getElementById("num1").value;
         var val2 = document.getElementById("num2").value;
         var resultDisplay = document.getElementById("result123");

         // 2. Try converting both inputs into numbers
         var n1 = Number(val1);
         var n2 = Number(val2);

         var result;

         // 3. Check if EITHER input is text (NaN) OR empty
         if (val1.trim() === "" || val2.trim() === "" || Number.isNaN(n1) || Number.isNaN(n2)) {
            // Join them together as strings (e.g., "app" + "le" = "apple")
            result = val1 + val2;
         } else {
            // Both are valid numbers, so add them mathematically (e.g., 5 + 5 = 10)
            result = n1 + n2;
         }

         resultDisplay.textContent = "Result: " + result;
      }
   </script>
</body>
</html>
